# Prefix
set -g prefix C-s
unbind C-b
bind -N "Send prefix" C-s send-prefix

# Config and help
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind -N "Split pane vertically" v split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" h split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

bind -N "Focus pane left" -n M-h select-pane -L
bind -N "Focus pane down" -n M-j select-pane -D
bind -N "Focus pane up" -n M-k select-pane -U
bind -N "Focus pane right" -n M-l select-pane -R

bind -N "Enter resize mode" r switch-client -T resize
bind -N "Resize pane left" -T resize h resize-pane -L 5 \; switch-client -T resize
bind -N "Resize pane down" -T resize j resize-pane -D 5 \; switch-client -T resize
bind -N "Resize pane up" -T resize k resize-pane -U 5 \; switch-client -T resize
bind -N "Resize pane right" -T resize l resize-pane -R 5 \; switch-client -T resize
bind -N "Exit resize mode" -T resize Escape switch-client -T root

# Window navigation
bind -N "Rename window" , command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" S-x kill-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Toggle sidebar" e display-message "Tmux has no sidebar equivalent"
bind -N "Zoom pane" z resize-pane -Z
bind -N "Detach client" d detach-client

# General
set -g default-terminal "tmux-256color"
set -g default-shell /usr/bin/zsh
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme (Og theme: top position, palette bg #0b0a12, active window blue #439ec2)
set -g status-style "bg=#0b0a12,fg=#908caa"
set -g status-left "#[fg=#08070e,bg=#ebbcba,bold] #S #[fg=#908caa,bg=#0b0a12] "
set -g status-right "#[fg=#ebbcba,bg=#0b0a12]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#6e6a86,bg=#0b0a12]#h "
set -g window-status-format "#[fg=#6e6a86,bg=#0b0a12] #I:#W "
set -g window-status-current-format "#[fg=#08070e,bg=#439ec2,bold] #I:#W "
set -g pane-border-style "fg=#403d52"
set -g pane-active-border-style "fg=#439ec2"
set -g message-style "bg=#0b0a12,fg=#439ec2"
set -g message-command-style "bg=#0b0a12,fg=#439ec2"
set -g mode-style "bg=#439ec2,fg=#08070e"
set -gw clock-mode-colour "#439ec2"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin settings
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
